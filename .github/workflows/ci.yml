name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    # BOTH PLATFORMS, because neither one alone is a superset and the gap is where the bugs live.
    #
    # Latch is developed and deployed on Windows -- the pre-push hook, the scheduled task, the 31 tracked
    # .ps1 files -- and this workflow only ever ran ubuntu. A test carrying a platform assumption therefore
    # passed one side and failed the other with nothing in between to notice.
    #
    # Not hypothetical, and not from this repo's imagination: the sibling Bureau repo added windows-latest
    # to its matrix on 2026-08-21 and the new leg went red within minutes on a REAL defect -- a repo path
    # guard that compared a realpath'd file against an unresolved root, so any repository reached through a
    # symlink, a junction or an 8.3 short name had every legitimate read refused. That one also hit macOS
    # (/tmp is a symlink to /private/tmp) and any Linux path with a symlinked component, and neither
    # platform's suite could see it alone. Latch is the credential boundary; it is the last place to keep a
    # blind spot for the sake of a shorter CI run.
    #
    # fail-fast: false because the whole value is seeing BOTH answers on one push. Cancelling the second leg
    # when the first fails reproduces exactly the blind spot this removes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # NO `defaults.run.shell` here, deliberately, unlike the sibling repo's workflow which needs bash for
    # PIPESTATUS and friends. The only run step below is `npm test`, which is shell-agnostic: npm executes
    # the script through cmd on Windows and sh on Linux, and the script is a plain `&&` chain that both
    # accept. Anything added later that uses bash syntax must pin the shell, or it will pass here and fail
    # on the Windows leg -- which is the failure mode this matrix exists to surface rather than to create.
    steps:
      # All three at v7 — current, and the reason for moving at all was the RUNTIME. The runners no longer
      # offer node20: an action declaring `using: node20` is forced onto node24 and announced as deprecated
      # on every run. These were on checkout@v4, setup-node@v4 and setup-python@v5, and ALL THREE of those
      # declare node20 — note that setup-python's node20 major is v5, one higher than its neighbours', which
      # is why "they were all on v4" was never true here. Read out of each action.yml rather than guessed.
      # Every major from node24 onward is v5+ for checkout and setup-node, v6+ for setup-python; v7 is at or
      # above that line for all three, so they can share one number again.
      #
      # Needs a runner at v2.327.1+, which GitHub-hosted ubuntu-latest is.
      #
      # What the later majors change that could touch this workflow, checked rather than skimmed:
      #   checkout      v6 moves credentials to a separate file; v7 blocks checking out a FORK PR under
      #                 `pull_request_target` and `workflow_run`. This one triggers on `push` and
      #                 `pull_request`, so that restriction does not reach it.
      #   setup-node    v5 added automatic caching when package.json carries a `packageManager` field, and
      #                 v6 narrowed it to npm only. This repo has no such field, so it is off either way.
      #   setup-python  v7 removes the `pip-install` input. This step passes only `python-version`, so
      #                 nothing here used it.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Load-bearing, not leftover: `npm test` runs test/run-python-tests.mjs, which exits non-zero when no
      # interpreter is found.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run smoke tests (${{ matrix.os }})
        run: npm test
